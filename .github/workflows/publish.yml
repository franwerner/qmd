name: Release

# This fork publishes to no registry: a v* tag builds, tests, and creates a
# GitHub release carrying the packed tarball people install from.
#
# The tarball is the install path rather than the git URL because npm runs a
# git dependency's `prepare` in a clone that has no node_modules — the build
# then cannot find tsc and the install dies. Installing a tarball runs no
# prepare at all, so the built dist/ inside it is simply used as-is.

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Verify lockfile is up-to-date
        run: bun install --frozen-lockfile

      - run: bun test --timeout 60000 --preload ./src/test-preload.ts test/
        env:
          CI: true
          LD_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false

      # `npm pack` runs prepare, so this builds dist/ AND produces the tarball
      # that gets attached below. A broken build still fails here, before the
      # release exists.
      #
      # qmd.tgz is a fixed-name copy of the same bytes, attached alongside the
      # versioned asset so releases/latest/download/qmd.tgz always resolves to
      # the newest release. See docs/RELEASE-CONTRACT.md.
      - name: Pack the install tarball
        id: pack
        run: |
          TARBALL=$(npm pack --silent | tail -1)
          cp "$TARBALL" "$RUNNER_TEMP/qmd.tgz"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Extract release notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(./scripts/extract-changelog.sh "$VERSION")
          # Write to file for gh release (avoids quoting issues)
          echo "$NOTES" > /tmp/release-notes.md

      # --latest is explicit: every fork version carries a -mate.N suffix, which
      # GitHub reads as a semver prerelease and would otherwise leave the
      # repository showing no latest release at all.
      - name: Create GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --latest \
            --notes-file /tmp/release-notes.md \
            "${{ steps.pack.outputs.tarball }}" \
            "$RUNNER_TEMP/qmd.tgz"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
